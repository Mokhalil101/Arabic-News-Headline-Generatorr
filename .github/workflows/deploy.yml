
name: Deploy Arabic News Headline Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp -r website/. _site/

          if [ -d "models" ]; then
            cp -r models _site/models
          elif [ -d "website/models" ]; then
            cp -r website/models _site/models
          else
            echo "ERROR: Models directory not found"
            exit 1
          fi

          if [ -d "config" ]; then
            cp -r config _site/config
          elif [ -d "website/config" ]; then
            cp -r website/config _site/config
          else
            echo "ERROR: Config directory not found"
            exit 1
          fi

          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
